// Trusted Web Activity: the app opens https://ramadanplanner.tahmid.space in the user's Chrome (full screen, no
// browser UI), so web push, sign-in and offline caching work as on the website. See docs/apps.md.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "ramadan-planner"
include ':app'
