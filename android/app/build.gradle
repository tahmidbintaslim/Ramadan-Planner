plugins {
    id 'com.android.application'
}

// The site this app opens, and the start page. `?app=android` tells the site it runs in the app, so it hides the
// donation links (src/routes/__root.tsx).
def site = [
    host     : 'ramadanplanner.tahmid.space',
    launchUrl: 'https://ramadanplanner.tahmid.space/today?app=android',
]

// Release signing reads android/keystore.properties (gitignored, never committed):
//   storeFile=/absolute/path/to/upload-keystore.jks
//   storePassword=...
//   keyAlias=upload
//   keyPassword=...
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystore.load(new FileInputStream(keystoreFile))

android {
    namespace 'space.tahmid.ramadanplanner'
    compileSdk 36

    defaultConfig {
        applicationId 'space.tahmid.ramadanplanner'
        minSdk 24
        targetSdk 36
        // Must rise with every upload to Google Play: CI passes its run number; a local build is 1 unless set.
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName '1.0.0'

        resValue 'string', 'hostName', site.host
        resValue 'string', 'launchUrl', site.launchUrl
        resValue 'string', 'providerAuthority', 'space.tahmid.ramadanplanner.fileprovider'
        resValue 'string', 'assetStatements',
            '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"https://' + site.host + '"}}]'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues true
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
